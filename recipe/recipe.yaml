schema_version: 1

context:
  version: 3.3.0
  python_min: '3.11'

package:
  name: graphrag-vectors
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/graphrag-vectors/graphrag_vectors-${{ version }}.tar.gz
  sha256: ca2c455f51567fb8c565236cd93827e7fd65c35f02c17ad58fffbafda9bfaaec

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling >=1.27.0,<2.0.0
    - pip
  run:
    - python >=${{ python_min }},<3.14
    - azure-core >=1.41,<2.dev0
    - azure-cosmos >=4.16,<5.dev0
    - azure-identity >=1.25,<2.dev0
    - azure-search-documents >=12.0,<13.dev0
    - graphrag-common ==3.3.0
    - lancedb >=0.38.0,<0.39.dev0
    - numpy >=2.4,<3.dev0
    - pyarrow >=25.0,<26.dev0
    - pydantic >=2.13,<3.dev0
tests:
  - python:
      imports:
        - graphrag_vectors
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'

about:
  summary: GraphRAG vector store package.
  license: MIT
  license_file: LICENSE
  homepage: https://pypi.org/project/graphrag-vectors/
  repository: https://github.com/microsoft/graphrag

extra:
  recipe-maintainers:
    - jan-janssen
